<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Summary</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f7f9;
      --panel: #ffffff;
      --text: #28343d;
      --muted: #71808a;
      --line: #dce5ea;
      --accent: #4e7188;
      --accent-dark: #36576c;
      --danger: #b64e59;
      --shadow: 0 8px 24px rgba(51, 75, 89, 0.08);
      font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 290px;
      margin-bottom: 20px;
      padding: 32px 470px 32px 32px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #eaf2f6;
      box-shadow: var(--shadow);
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .brand-logo {
      width: 128px;
      height: auto;
      opacity: .7;
    }

    h1 {
      margin: 0;
      color: var(--accent-dark);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .mascot {
      position: absolute;
      right: 24px;
      bottom: 12px;
      width: 410px;
      height: 260px;
      object-fit: contain;
      object-position: center bottom;
      filter: none;
    }

    .status {
      min-height: 22px;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .header-tools {
      position: absolute;
      z-index: 2;
      top: 16px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel.full { grid-column: 1 / -1; }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel:nth-child(1) .panel-head,
    .panel:nth-child(2) .panel-head { background: #f7fafb; }

    .panel-title {
      font-size: 15px;
      font-weight: 850;
    }

    .panel-title span {
      margin-left: 6px;
      color: var(--accent);
      font-weight: 700;
    }

    .panel-tools,
    .actions-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      min-height: 36px;
      border: 0;
      border-radius: 7px;
      padding: 0 14px;
      color: var(--text);
      background: #fff;
      box-shadow: none;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: background 140ms ease;
    }

    button:hover {
      background: #eef3f5;
    }

    button:focus-visible,
    textarea:focus-visible,
    pre:focus-visible {
      outline: 3px solid rgba(78, 113, 136, .24);
      outline-offset: 2px;
    }

    .primary {
      color: #fff;
      background: var(--accent);
    }

    .primary:hover { background: var(--accent-dark); }

    #copyResult { background: #fff; }

    .ghost {
      color: var(--muted);
      background: transparent;
      box-shadow: none;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 310px;
      resize: vertical;
      border: 0;
      padding: 16px;
      color: var(--text);
      background: #fffefe;
      white-space: pre;
      font: 13px/1.55 Consolas, "Cascadia Mono", monospace;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 16px;
      background: #f7fafb;
    }

    .result {
      min-height: 190px;
      margin: 0;
      padding: 18px;
      overflow: auto;
      border: 0;
      border-radius: 0;
      color: #edf5f8;
      background: #314a59;
      white-space: pre-wrap;
      tab-size: 2;
      font: 15px/1.75 Consolas, "Cascadia Mono", "Malgun Gothic", monospace;
    }

    .rule-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: #f7fafb;
      font-size: 12px;
    }

    .rule-grid div {
      padding: 10px 14px;
      border-right: 1px solid var(--line);
    }

    .rule-grid div:last-child { border-right: 0; }
    .error { color: var(--danger); }
    .ok { color: var(--accent-dark); }

    footer {
      padding: 18px 4px 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    .viewer {
      margin-bottom: 20px;
    }

    .viewer-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .file-button {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      border-radius: 7px;
      padding: 0 14px;
      color: #fff;
      background: var(--accent);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .file-button input {
      display: none;
    }

    select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 10px;
      color: var(--text);
      background: #fff;
      font: inherit;
    }

    .viewer-content {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .viewer-content[hidden] {
      display: none;
    }

    .patient-banner {
      grid-column: 1 / -1;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .patient-banner strong {
      display: block;
      color: var(--accent-dark);
      font-size: 20px;
    }

    .patient-banner span {
      color: var(--muted);
      font-size: 13px;
    }

    .result-form {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .result-form h2 {
      margin: 0;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--accent-dark);
      background: #f7fafb;
      font-size: 15px;
    }

    .editable-output {
      min-height: 150px;
      background: #fff;
      font: 14px/1.8 Consolas, "Cascadia Mono", "Malgun Gothic", monospace;
    }

    .editable-output.final {
      min-height: 340px;
      color: #edf5f8;
      background: #314a59;
    }

    @media (max-width: 820px) {
      main {
        width: min(100vw - 18px, 1180px);
        padding-top: 10px;
      }

      .workspace { grid-template-columns: 1fr; }
      .patient-banner { grid-column: 1; }

      header {
        min-height: 215px;
        padding: 22px 175px 22px 18px;
        border-radius: 10px;
      }

      .brand-logo { width: 96px; }
      h1 { font-size: 27px; }
      .tagline { font-size: 12px; }
      .status { display: none; }

      .header-tools {
        top: 10px;
        right: 10px;
      }

      .mascot {
        right: 4px;
        bottom: 8px;
        width: 180px;
        height: 180px;
        object-fit: contain;
      }

      .rule-grid { grid-template-columns: 1fr; }

      .rule-grid div {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .rule-grid div:last-child { border-bottom: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <img class="brand-logo" src="trinity-logo.svg" alt="트리니티병원">
        <h1>Lab Summary</h1>
        <p class="tagline">오늘도 가볍게, 한눈에 정리</p>
      </div>
      <img class="mascot" src="lab-mascot.png" alt="">
      <div class="header-tools">
        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </header>

    <section class="viewer" aria-label="자동화 결과">
      <div class="viewer-toolbar">
        <label class="file-button">
          자동화 결과 불러오기
          <input id="viewerFile" type="file" accept=".json,application/json">
        </label>
        <select id="patientSelect" hidden aria-label="환자 선택"></select>
        <span id="viewerStatus" class="status"></span>
      </div>
      <div id="viewerContent" class="viewer-content" hidden>
        <div class="patient-banner">
          <strong id="viewerPatient"></strong>
          <span id="viewerDates"></span>
        </div>
        <section class="result-form">
          <h2>피검사</h2>
          <textarea id="viewerLab" class="editable-output" spellcheck="false"></textarea>
        </section>
        <section class="result-form">
          <h2>UA 검사</h2>
          <textarea id="viewerUa" class="editable-output" spellcheck="false"></textarea>
        </section>
        <section class="result-form">
          <h2>Sputum</h2>
          <textarea id="viewerSputum" class="editable-output" spellcheck="false"></textarea>
        </section>
        <section class="result-form">
          <h2>Stool</h2>
          <textarea id="viewerStool" class="editable-output" spellcheck="false"></textarea>
        </section>
        <section class="result-form">
          <h2>VRE/CRE</h2>
          <textarea id="viewerVreCre" class="editable-output" spellcheck="false"></textarea>
        </section>
        <section class="result-form">
          <h2>Blood culture</h2>
          <textarea id="viewerBloodCulture" class="editable-output" spellcheck="false"></textarea>
        </section>
        <section class="result-form">
          <h2>최종 검사 결과</h2>
          <div class="actions">
            <button type="button" class="primary" id="generateFinal">전체 결과 생성</button>
            <button type="button" id="copyFinal">전체 결과 복사</button>
          </div>
          <textarea id="viewerFinal" class="editable-output final" spellcheck="false"></textarea>
        </section>
      </div>
    </section>
    <footer>
      © 2026 Hannah J ·
      <a href="mailto:hannah.j.dev@gmail.com">hannah.j.dev@gmail.com</a>
    </footer>
  </main>

  <script>
    const ABBR = new Map(Object.entries({
      "Protein, total": "Pro",
      "Albumin": "Alb",
      "BUN": "BUN",
      "Creatinine": "Cr",
      "Glucose": "Glu",
      "Bilirubin, total": "T-bil",
      "AST (GOT)": "OT",
      "ALT (GPT)": "PT",
      "GGT (γ-GTP)": "GGT",
      "ALP": "ALP",
      "CK (Creatine kinase)": "CK",
      "ACP (Acid phosphatase)": "ACP",
      "Cholesterol,total": "TC",
      "Triglyceride (TG)": "TG",
      "Sodium (Na)": "Na",
      "Potassium (K)": "K",
      "Chloride (Cl)": "Cl",
      "CO2, Total": "CO2",
      "Cystatin-C": "CysC",
      "eGFR (CKD-EPI 2012)": "eGFR",
      "ADA (Adenosine deaminase)": "ADA",
      "WBC": "WBC",
      "RBC": "RBC",
      "Hemoglobin (Hb)": "Hb",
      "Hematocrit (Hct)": "Hct",
      "Platelet": "PLT",
      "Absolute neutrophil count (ANC)": "ANC",
      "CRP (정량)": "CRP",
      "Procalcitonin": "PCT",
      "TSH": "TSH",
      "Free T4": "T4",
      "Free T3": "T3"
    }));

    const UA_ABBR = new Map(Object.entries({
      "PH": "pH",
      "Nitrite": "Nit",
      "S.G": "SG",
      "Protein": "Pro",
      "Glucose": "Glu",
      "Ketone": "Ket",
      "Bilirubin": "Bil",
      "Occult Blood": "OB",
      "Urobilinogen": "Uro",
      "Leukocyte esterase": "LE",
      "RBC": "uRBC",
      "WBC": "uWBC",
      "E.P cells": "Epi",
      "Casts": "Cast",
      "Bacteria": "Bac",
      "Crystals": "Cry",
      "Others": "Other"
    }));

    const IGNORE = new Set([
      "MCV",
      "MCH",
      "MCHC",
      "Segmented neutrophil",
      "Band",
      "Lymphocyte",
      "Monocyte",
      "Eosinophil",
      "Basophil",
      "Differential count"
    ]);

    const LAB_ORDER = [
      "WBC",
      "CRP (정량)",
      "Protein, total",
      "Albumin",
      "BUN",
      "Creatinine",
      "Glucose",
      "Bilirubin, total",
      "AST (GOT)",
      "ALT (GPT)",
      "GGT (γ-GTP)",
      "ALP",
      "CK (Creatine kinase)",
      "ACP (Acid phosphatase)",
      "Cholesterol,total",
      "Triglyceride (TG)",
      "Chloride (Cl)",
      "CO2, Total",
      "Cystatin-C",
      "eGFR (CKD-EPI 2012)",
      "ADA (Adenosine deaminase)",
      "RBC",
      "Hemoglobin (Hb)",
      "Hematocrit (Hct)",
      "Platelet",
      "Absolute neutrophil count (ANC)",
      "Procalcitonin",
      "TSH",
      "Free T4",
      "Free T3"
    ];

    const UA_ORDER = [
      "PH",
      "Nitrite",
      "S.G",
      "Protein",
      "Glucose",
      "Ketone",
      "Bilirubin",
      "Occult Blood",
      "Urobilinogen",
      "Leukocyte esterase",
      "RBC",
      "WBC",
      "E.P cells",
      "Casts",
      "Bacteria",
      "Crystals",
      "Others"
    ];

    const $ = (id) => document.getElementById(id);
    let viewerPatients = [];

    function setStatus(message, type = "") {
      const node = $("status");
      node.textContent = message;
      node.className = `status ${type}`.trim();
    }

    function formatOtherItems(items) {
      return (items || [])
        .map((item) => `[${item.date || "-"}] ${item.name}: ${item.result || "결과 대기"}`)
        .join("\n");
    }

    function setOptionalForm(textareaId, items) {
      const textarea = $(textareaId);
      const form = textarea.closest(".result-form");
      const text = formatOtherItems(items);
      textarea.value = text;
      form.hidden = !text;
    }

    function setTextForm(textareaId, text) {
      const textarea = $(textareaId);
      const form = textarea.closest(".result-form");
      textarea.value = text || "";
      form.hidden = !textarea.value.trim();
    }

    function generateFinalResult() {
      const patient = $("viewerPatient").textContent.trim();
      const dates = $("viewerDates").textContent.trim();
      const sections = [
        [patient, dates].filter(Boolean).join("\n"),
        $("viewerLab").value.trim(),
        $("viewerUa").value.trim(),
        $("viewerSputum").value.trim() && `Sputum\n${$("viewerSputum").value.trim()}`,
        $("viewerStool").value.trim() && `Stool\n${$("viewerStool").value.trim()}`,
        $("viewerVreCre").value.trim() && `VRE/CRE\n${$("viewerVreCre").value.trim()}`,
        $("viewerBloodCulture").value.trim() && `Blood culture\n${$("viewerBloodCulture").value.trim()}`
      ].filter(Boolean);
      $("viewerFinal").value = sections.join("\n\n");
    }

    function renderPatient(index) {
      const patient = viewerPatients[index];
      if (!patient) return;
      $("viewerContent").hidden = false;
      $("viewerPatient").textContent = `${patient.name}${patient.chartNo ? ` (${patient.chartNo})` : ""}`;
      $("viewerDates").textContent = `최근 검사 ${patient.recentDate || "-"} · 이전 검사 ${patient.previousDate || "-"}`;
      setTextForm("viewerLab", patient.lab);
      setTextForm("viewerUa", patient.ua);
      setOptionalForm("viewerSputum", patient.sputum);
      setOptionalForm("viewerStool", patient.stool);
      setOptionalForm("viewerVreCre", patient.vreCre);
      setOptionalForm("viewerBloodCulture", patient.bloodCulture);
      $("viewerFinal").value = "";
    }

    function loadViewerData(data) {
      viewerPatients = Array.isArray(data.patients) ? data.patients : [];
      if (!viewerPatients.length) throw new Error("환자 결과가 없습니다.");

      // 오늘 결과 환자를 앞으로 정렬
      viewerPatients = [
        ...viewerPatients.filter((p) => p.isNewToday),
        ...viewerPatients.filter((p) => !p.isNewToday)
      ];

      const todayCount = viewerPatients.filter((p) => p.isNewToday).length;
      const select = $("patientSelect");
      select.replaceChildren();

      if (todayCount > 0) {
        const todayGroup = document.createElement("optgroup");
        todayGroup.label = `▶ 오늘 결과 (${todayCount}명)`;
        viewerPatients.filter((p) => p.isNewToday).forEach((patient, i) => {
          const option = document.createElement("option");
          option.value = String(i);
          option.textContent = `${patient.name}${patient.chartNo ? ` (${patient.chartNo})` : ""}`;
          todayGroup.append(option);
        });
        select.append(todayGroup);
      }

      const prevPatients = viewerPatients.filter((p) => !p.isNewToday);
      if (prevPatients.length > 0) {
        const prevGroup = document.createElement("optgroup");
        prevGroup.label = `이전 결과 (${prevPatients.length}명)`;
        prevPatients.forEach((patient, i) => {
          const option = document.createElement("option");
          option.value = String(todayCount + i);
          option.textContent = `${patient.name}${patient.chartNo ? ` (${patient.chartNo})` : ""}`;
          prevGroup.append(option);
        });
        select.append(prevGroup);
      }

      select.hidden = viewerPatients.length < 2;
      $("viewerStatus").textContent = `오늘 결과 ${todayCount}명 / 전체 ${viewerPatients.length}명`;
      renderPatient(0);
    }

    async function loadViewerFile(file) {
      try {
        const data = JSON.parse(await file.text());
        loadViewerData(data);
      } catch (error) {
        $("viewerStatus").textContent = `불러오기 실패: ${error.message}`;
      }
    }

    function normalizeValue(value) {
      const cleaned = (value || "").trim();
      if (!cleaned || cleaned === "**") return "";
      if (/보고\s*예정|보고예정|^\d{2}\/\d{2}\s+\S+/.test(cleaned)) return "예정";
      if (/positive/i.test(cleaned)) return cleaned.replace(/positive/ig, "p");
      return cleaned;
    }

    function canonicalName(name) {
      const cleaned = name.trim();
      if (/^CRP\b/.test(cleaned)) return "CRP (정량)";
      return cleaned;
    }

    function normalizeFlag(flag) {
      const cleaned = (flag || "").trim().toUpperCase();
      return cleaned === "H" || cleaned === "L" ? cleaned : "";
    }

    function valueWithFlag(row) {
      if (!row) return "";
      const value = normalizeValue(row.result);
      return value ? `${value}${normalizeFlag(row.flag)}` : "";
    }

    function formattedResult(row) {
      if (!row) return "()";
      return `(${normalizeValue(row.result)})${normalizeFlag(row.flag)}`;
    }

    function isUaParent(parent) {
      return parent === "Urine(10)" || parent === "Microscopic (Flow Cytometry)";
    }

    function isResultLine(line) {
      return line.includes("\t") && !/^[-=\s]+$/.test(line.trim());
    }

    function parseRows(text) {
      const rows = [];
      let activeParent = "";

      text.split(/\r?\n/).forEach((rawLine) => {
        if (!isResultLine(rawLine)) return;

        const cols = rawLine.split("\t");
        while (cols.length < 6) cols.push("");

        const code = cols[0].trim();
        const name = canonicalName(cols[1]);
        if (!name) return;

        const result = cols[2].trim();
        const row = {
          code,
          name,
          result,
          reference: cols[3].trim(),
          flag: normalizeFlag(cols[4]),
          date: cols[5].trim(),
          parent: activeParent
        };

        if (code && result === "**") {
          activeParent = name;
          rows.push({ ...row, parent: "" });
          return;
        }

        if (code && result !== "**") {
          activeParent = "";
          row.parent = "";
        }

        rows.push(row);
      });

      return rows;
    }

    function indexRows(rows, mode) {
      const lab = new Map();
      const ua = new Map();

      rows.forEach((row) => {
        if (row.result === "**" || IGNORE.has(row.name)) return;

        if (isUaParent(row.parent)) {
          if (UA_ABBR.has(row.name)) ua.set(row.name, row);
          return;
        }

        if (ABBR.has(row.name)) {
          lab.set(row.name, row);
        }
      });

      return { lab, ua, mode };
    }

    function isPending(row) {
      return normalizeValue(row?.result) === "예정";
    }

    function hasFlag(row) {
      return normalizeFlag(row?.flag) !== "";
    }

    function numericValue(value) {
      const match = String(value || "").replace(",", "").match(/-?\d+(?:\.\d+)?/);
      return match ? Number(match[0]) : NaN;
    }

    function simpleRange(reference) {
      const cleaned = String(reference || "")
        .replace(/[＜≤]/g, "<")
        .replace(/[＞≥]/g, ">")
        .replace(/\s+/g, " ");
      const between = cleaned.match(/(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)/);
      if (between) {
        return { min: Number(between[1]), max: Number(between[2]) };
      }
      const upper = cleaned.match(/<\s*(-?\d+(?:\.\d+)?)/);
      if (upper) {
        return { max: Number(upper[1]) };
      }
      const lower = cleaned.match(/>\s*(-?\d+(?:\.\d+)?)/);
      if (lower) {
        return { min: Number(lower[1]) };
      }
      return null;
    }

    function isUaAbnormal(row) {
      if (!row) return false;
      if (hasFlag(row)) return true;

      const value = normalizeValue(row.result);
      if (!value || value === "예정") return false;

      const ref = row.reference.trim();
      const lowValue = value.toLowerCase();
      const lowRef = ref.toLowerCase();
      const normalWords = ["negative", "normal", "not found"];
      if (normalWords.includes(lowRef)) return lowValue !== lowRef;

      const range = simpleRange(ref);
      const number = numericValue(value);
      if (range && Number.isFinite(number)) {
        if (range.min !== undefined && number < range.min) return true;
        if (range.max !== undefined && number > range.max) return true;
      }

      return false;
    }

    function formatPair(label, recentRow, previousRow) {
      return `${label}${formattedResult(recentRow)}<-${formattedResult(previousRow)}`;
    }

    function shouldShowLab(name, recentRow, previousRow) {
      if (name === "WBC" || name === "CRP (정량)") return true;
      if (name === "Glucose") {
        const recentValue = numericValue(recentRow?.result);
        const previousValue = numericValue(previousRow?.result);
        const recentOver150 = Number.isFinite(recentValue) && recentValue > 150;
        const previousOver150 = Number.isFinite(previousValue) && previousValue > 150;
        return recentOver150 || previousOver150;
      }
      return hasFlag(recentRow) || hasFlag(previousRow) || isPending(recentRow) && hasFlag(previousRow);
    }

    function formatCombined(label, firstName, secondName, recent, previous) {
      const recentFirst = valueWithFlag(recent.lab.get(firstName));
      const recentSecond = valueWithFlag(recent.lab.get(secondName));
      const previousFirst = valueWithFlag(previous.lab.get(firstName));
      const previousSecond = valueWithFlag(previous.lab.get(secondName));
      return `${label}(${recentFirst}/${recentSecond})<-(${previousFirst}/${previousSecond})`;
    }

    function shouldShowCombined(firstName, secondName, recent, previous) {
      return shouldShowLab(firstName, recent.lab.get(firstName), previous.lab.get(firstName))
        || shouldShowLab(secondName, recent.lab.get(secondName), previous.lab.get(secondName));
    }

    function sortByOrder(names, order) {
      const orderMap = new Map(order.map((name, index) => [name, index]));
      return names.sort((a, b) => {
        const ai = orderMap.has(a) ? orderMap.get(a) : 999;
        const bi = orderMap.has(b) ? orderMap.get(b) : 999;
        return ai - bi || a.localeCompare(b);
      });
    }

    function wrapItems(prefix, items) {
      if (!items.length) return `${prefix} :`;

      const indent = " ".repeat(prefix.length + 3);
      const lines = [];
      for (let index = 0; index < items.length; index += 3) {
        const line = items.slice(index, index + 3).join("            ");
        lines.push(index === 0 ? `${prefix} : ${line}` : `${indent}${line}`);
      }
      return lines.join("\n");
    }

    function displayLabel(name, recentRow) {
      const label = ABBR.get(name) || name;
      if (name !== "Albumin") return label;
      const recentValue = numericValue(recentRow?.result);
      return Number.isFinite(recentValue) && recentValue >= 2 && recentValue < 3 ? `★${label}` : label;
    }

    function representativeDate(text) {
      const counts = new Map();
      parseRows(text).forEach((row) => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(row.date)) return;
        counts.set(row.date, (counts.get(row.date) || 0) + 1);
      });
      return [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || b[0].localeCompare(a[0]))[0]?.[0] || "";
    }

    function buildSummary(previousText, recentText) {
      const previous = indexRows(parseRows(previousText), "previous");
      const recent = indexRows(parseRows(recentText), "recent");

      const labItems = [];
      labItems.push(formatPair("WBC", recent.lab.get("WBC"), previous.lab.get("WBC")));
      labItems.push(formatPair("CRP", recent.lab.get("CRP (정량)"), previous.lab.get("CRP (정량)")));
      labItems.push(formatCombined("Na/K", "Sodium (Na)", "Potassium (K)", recent, previous));

      if (shouldShowCombined("BUN", "Creatinine", recent, previous)) {
        labItems.push(formatCombined("BUN/Cr", "BUN", "Creatinine", recent, previous));
      }

      if (shouldShowCombined("AST (GOT)", "ALT (GPT)", recent, previous)) {
        labItems.push(formatCombined("OT/PT", "AST (GOT)", "ALT (GPT)", recent, previous));
      }

      const names = new Set([...previous.lab.keys(), ...recent.lab.keys()]);
      names.delete("WBC");
      names.delete("CRP (정량)");
      names.delete("Sodium (Na)");
      names.delete("Potassium (K)");
      names.delete("BUN");
      names.delete("Creatinine");
      names.delete("AST (GOT)");
      names.delete("ALT (GPT)");

      sortByOrder([...names], LAB_ORDER).forEach((name) => {
        const recentRow = recent.lab.get(name);
        const previousRow = previous.lab.get(name);
        if (!shouldShowLab(name, recentRow, previousRow)) return;
        labItems.push(formatPair(displayLabel(name, recentRow), recentRow, previousRow));
      });

      const uaItems = [];
      const uaNames = sortByOrder([...new Set([...previous.ua.keys(), ...recent.ua.keys()])], UA_ORDER);
      uaNames.forEach((name) => {
        const recentRow = recent.ua.get(name);
        const previousRow = previous.ua.get(name);
        if (!isUaAbnormal(recentRow) && !isUaAbnormal(previousRow)) return;
        uaItems.push(formatPair(UA_ABBR.get(name) || name, recentRow, previousRow));
      });

      return `${wrapItems("Lab 결과", labItems)}\n${wrapItems("UA 결과", uaItems)}`;
    }

    async function copyFinalResult() {
      const text = $("viewerFinal").value.trim();
      if (!text) {
        $("viewerStatus").textContent = "복사할 결과가 없어요.";
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        $("viewerStatus").textContent = "전체 결과 복사 완료";
      } catch {
        $("viewerStatus").textContent = "브라우저에서 복사를 허용하지 않았어요.";
      }
    }

    $("viewerFile").addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      if (file) loadViewerFile(file);
    });
    $("patientSelect").addEventListener("change", (event) => {
      renderPatient(Number(event.target.value));
    });
    $("generateFinal").addEventListener("click", generateFinalResult);
    $("copyFinal").addEventListener("click", copyFinalResult);

    if (typeof __VIEWER_DATA__ !== "undefined") {
      try { loadViewerData(__VIEWER_DATA__); } catch (error) {
        $("viewerStatus").textContent = `불러오기 실패: ${error.message}`;
      }
    }
  </script>
</body>
</html>
