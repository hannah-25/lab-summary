<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <nav class="tabs">
    <button class="tab active" data-tab="monitor">기타검사 감시</button>
    <button class="tab" data-tab="lookup">혈액 / UA 조회</button>
  </nav>

  <!-- 감시 탭 -->
  <div id="tab-monitor" class="panel active">
    <div class="bar">
      <span class="ttl">감시</span>
      <button id="checkNow" class="primary">지금 확인</button>
    </div>
    <div id="status" class="status"></div>

    <h2>최근 새 결과</h2>
    <div id="results" class="results"></div>

    <h2>기타검사 조회</h2>
    <div class="add-row">
      <label class="days">최근
        <input id="otherLookupDays" type="number" min="1" max="365" value="30" /> 일
      </label>
      <button id="otherLookupBtn" class="primary">최근 3개 뷰어 열기</button>
    </div>
    <div id="otherLookupStatus" class="status" hidden></div>

    <h2>감시 환자</h2>
    <div class="add-row">
      <input id="nameInput" type="text" placeholder="환자 이름 (예: 홍길동2)" />
      <button id="addBtn">추가</button>
    </div>
    <ul id="watchlist" class="chips"></ul>
  </div>

  <!-- 혈액/UA 조회 탭 -->
  <div id="tab-lookup" class="panel">
    <h2>환자 이름 (여러 명은 쉼표 또는 줄바꿈)</h2>
    <textarea id="lookupNames" rows="3" placeholder="홍길동, 김영희&#10;박철수2"></textarea>
    <div class="add-row">
      <label class="days">최근
        <input id="lookupDays" type="number" min="1" max="365" value="60" /> 일
      </label>
      <button id="lookupBtn" class="primary">조회</button>
      <button id="copyBtn">복사</button>
    </div>
    <div id="lookupStatus" class="status" hidden></div>
    <pre id="lookupOut" class="report"></pre>
  </div>

  <script src="popup.js"></script>
</body>
</html>
